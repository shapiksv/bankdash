server:
  port: 8083

bankdash:
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
  messaging:
    outbox:
      enabled: true

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/account}
    username: ${ACCOUNT_DB_USER:account}
    password: ${ACCOUNT_DB_PASSWORD:account}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service
      # A new consumer group starts at the beginning, so users registered before the first start get accounts.
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${bankdash.services.auth}/.well-known/jwks.json
          # With jwk-set-uri set this is only compared against the iss claim, there is no discovery.
          issuer-uri: bankdash-auth
          audiences: bankdash-api
  threads:
    virtual:
      enabled: true
  web:
    # Error messages are English whatever the browser or JVM locale (otherwise Bean Validation's defaults
    # follow Accept-Language, mixed with our own English messages).
    locale: en
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health,info
