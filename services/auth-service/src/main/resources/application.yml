server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  threads:
    virtual:
      enabled: true
  web:
    # Error messages are English whatever the browser or JVM locale (otherwise Bean Validation's defaults
    # follow Accept-Language, mixed with our own English messages).
    locale: en
    locale-resolver: fixed

bankdash:
  messaging:
    outbox:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: dev

bankdash:
  auth:
    # Plain http://localhost in development.
    refresh-cookie:
      secure: false
